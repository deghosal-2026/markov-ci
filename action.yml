name: markov-ci
description: >-
  Markov-planned, guardrailed CI/CD — forecast, govern, and learn from your
  agentic repair loops. Never merges, never force-pushes.
author: deghosal-2026

branding:
  icon: git-pull-request
  color: purple

inputs:
  config:
    description: "Path to your markov-ci config YAML (default: the packaged default)."
    required: false
    default: ""
  junit:
    description: JUnit XML produced by your test step.
    required: true
  repo:
    description: "Repository to validate (default: the checked-out workspace)."
    required: false
    default: ""
  seed:
    description: Seeded determinism for the simulated agent.
    required: false
    default: "42"
  adapter:
    description: >-
      Agent adapter to use — "simulated" (offline) or "harness" (opt-in extra). For
      pull_request from untrusted authors (forks), enable `container` (see below).
    required: false
    default: ""
  container:
    description: >-
      Container image to run validation in (ADR-0012). Recommended (and the default
      for fork PRs) so untrusted PR code cannot reach host credentials. Empty = the
      interim host-clone path.
    required: false
    default: ""
  publish:
    description: >-
      "true" to apply the validated diff to a fresh ai-fix/* branch and push it
      (never the PR branch, never main, never force). Default "false".
    required: false
    default: "false"
  failing-command:
    description: "Command that reproduces the failure (default: from config, else pytest -q)."
    required: false
    default: ""
  regression-command:
    description: "Broader regression command; empty skips the s4 regression check."
    required: false
    default: ""
  max-tokens:
    description: "Per-run token-budget override (default: from config)."
    required: false
    default: ""
  wall-clock:
    description: "Per-run wall-clock-budget override in seconds (default: from config)."
    required: false
    default: ""

outputs:
  absorbing-state:
    description: a1_ready_for_human_review | a2_escalate_to_author | a3_budget_exceeded
    value: ${{ steps.govern.outputs.absorbing-state }}
  exit-code:
    description: Run outcome code (0 = a1, 1 = a2, 2 = usage error, 3 = a3, 4 = invalid config, 5 = internal).
    value: ${{ steps.govern.outputs.exit-code }}
  run-id:
    description: Correlates with the uploaded event-stream artifact.
    value: ${{ steps.govern.outputs.run-id }}
  patch-branch:
    description: The isolated ai-fix/* branch, if a patch applied.
    value: ${{ steps.govern.outputs.patch-branch }}
  events-path:
    description: Path to the uploaded events.jsonl artifact.
    value: ${{ steps.govern.outputs.events-path }}
  patch-path:
    description: Path to the uploaded validated-patch artifact, if a fix was validated.
    value: ${{ steps.govern.outputs.patch-path }}

runs:
  using: composite
  steps:
    - name: Install markov-ci
      shell: bash
      run: python3 -m pip install --disable-pip-version-check "${{ github.action_path }}"

    - name: Govern the run
      id: govern
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_SEED: ${{ inputs.seed }}
        INPUT_ADAPTER: ${{ inputs.adapter }}
        INPUT_CONTAINER: ${{ inputs.container }}
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_FAILING_COMMAND: ${{ inputs.failing-command }}
        INPUT_REGRESSION_COMMAND: ${{ inputs.regression-command }}
        INPUT_MAX_TOKENS: ${{ inputs.max-tokens }}
        INPUT_WALL_CLOCK: ${{ inputs.wall-clock }}
      run: bash "${{ github.action_path }}/action/run.sh"

    - name: Upload the event stream
      if: ${{ always() && steps.govern.outputs.events-path != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: markov-ci-events-${{ steps.govern.outputs.run-id }}
        path: ${{ steps.govern.outputs.events-path }}
        if-no-files-found: warn

    - name: Upload the validated patch
      if: ${{ always() && steps.govern.outputs.patch-path != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: markov-ci-patch-${{ steps.govern.outputs.run-id }}
        path: ${{ steps.govern.outputs.patch-path }}
        if-no-files-found: warn
