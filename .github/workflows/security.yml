name: security

# Release security & supply-chain gate (issue #60 / M10.8).
# This workflow must be green before a release is published and before the public flip.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (working tree + full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history — a leaked secret in an old commit still counts

      - name: gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: trufflehog (verified findings only)
        uses: trufflesecurity/trufflehog@ffdee00aded8ed6e545aba48ef7956522d3b076e # main
        with:
          extra_args: --results=verified,unknown

  dependency-audit-and-sast:
    name: dependency audit + SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package + security tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pip-audit>=2" "bandit>=1.7"

      - name: pip-audit (shipped dependencies)
        run: pip-audit

      - name: bandit (SAST, medium+ severity)
        run: bandit -r src/markov_ci -ll

  licenses-and-sbom:
    name: license check + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-licenses cyclonedx-bom
      - name: License check (fail on copyleft in runtime deps)
        run: pip-licenses --fail-on "GPL;AGPL"
      - name: Generate SBOM
        run: cyclonedx-py environment --of json -o sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
