name: release

# Release pipeline (M10.2 / #47), gated by the security checks (M10.8 / #60):
# the gate runs in this workflow on the exact tag being published — a release
# cannot go out while any scanner reports a finding.
#
# v0.1.0 publishes with a scoped PyPI API token held ONLY as an encrypted
# GitHub Actions secret (PYPI_API_TOKEN) — never in this repository. Rotate the
# token after the release; the follow-up is PyPI Trusted Publishing (OIDC +
# PEP 740 attestations) once its pending publisher is registered.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: security gate (blocking, M10.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — a secret in an old commit still counts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: trufflehog (full history, verified findings)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

      - name: Install for audits
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pip-audit>=2" "bandit>=1.7" pip-licenses cyclonedx-bom

      - name: pip-audit (shipped dependencies)
        run: pip-audit

      - name: bandit (SAST, medium+ severity)
        run: bandit -r src/markov_ci -ll

      - name: License check (fail on copyleft in runtime deps)
        run: pip-licenses --fail-on "GPL;AGPL"

      - name: Generate SBOM
        run: cyclonedx-py environment --of json -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: PyPI
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

  github-release:
    name: GitHub Release (SBOM attached)
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom.json
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.json
          generate_release_notes: true
          fail_on_unmatched_files: true
