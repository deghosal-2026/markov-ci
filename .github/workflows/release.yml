name: release

# Release pipeline (M10.2 / #47). A release is gated by the security checks (M10.8)
# AND the full test suite (M13.32) on the exact tag being published, and the tag is
# checked against the project version and `main` (M13.33). Publishing uses PyPI
# Trusted Publishing (OIDC + PEP 740 attestations) — no long-lived token (M13.34).
#
# All actions are pinned by full commit SHA with a version comment (M13.35);
# Dependabot keeps them fresh.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: security gate (blocking, M10.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history — a secret in an old commit still counts
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: trufflehog (full history, verified findings)
        uses: trufflesecurity/trufflehog@ffdee00aded8ed6e545aba48ef7956522d3b076e # main
        with:
          extra_args: --results=verified,unknown

      - name: Install for audits
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pip-audit>=2" "bandit>=1.7" pip-licenses cyclonedx-bom

      - name: pip-audit (shipped dependencies)
        run: pip-audit

      - name: bandit (SAST, medium+ severity)
        run: bandit -r src/markov_ci -ll

      - name: License check (fail on copyleft in runtime deps)
        run: pip-licenses --fail-on "GPL;AGPL"

      - name: Generate SBOM
        run: cyclonedx-py environment --of json -o sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json

  test:
    name: test suite (py${{ matrix.python-version }}, M13.32)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: mypy --strict
        run: mypy
      - name: pytest + coverage (>=95%, branch)
        run: pytest --cov=markov_ci --cov-branch --cov-fail-under=95

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: [gate, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag/version + main check (M13.33)
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::tag ${tag} does not match project.version v${version}"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::the tagged commit is not on main"
            exit 1
          fi
      - run: python -m pip install --upgrade pip build && python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      id-token: write # OIDC — the only job that gets it (M13.34)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (OIDC, attested)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  github-release:
    name: GitHub Release (SBOM attached)
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      - name: Create the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*
            sbom/sbom.json
          generate_release_notes: true
          fail_on_unmatched_files: true
