name: mutation

# Scheduled mutation testing (M13.36). Mutation score is a stronger signal than
# line coverage: it asks whether the tests would *notice* a wrong implementation.
# Runs weekly; a kill-rate below the floor fails the job.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: mutation score (policy, guardrails, engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" mutmut
      - name: Run mutation testing
        run: |
          mutmut run --paths-to-mutate src/markov_ci/policy,src/markov_ci/guardrails,src/markov_ci/engine --tests-dir tests --runner "pytest -q -x" || true
          mutmut results
      - name: Enforce the kill-rate floor
        run: python scripts/mutation_kill_rate.py 0.60
