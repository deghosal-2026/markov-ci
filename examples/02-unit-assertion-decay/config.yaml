# Example 02 — unit-assertion decay → escalation.
# The packaged default pipeline (spec 0001 §3–4). A unit-assertion failure the
# agent's patch does not resolve: the per-attempt success prior decays
# [0.74, 0.45, 0.15], and the confidence gate escalates before attempt 3.
version: 1

states:
  s0_deterministic_verify:
    type: transient
  s1_failure_triage:
    type: transient
  s2_agent_reasoning:
    type: transient
    loop_capable: true
  s3_sandbox_validation:
    type: transient
    loop_capable: true
  s4_regression_check:
    type: transient
  a1_ready_for_human_review:
    type: absorbing
  a2_escalate_to_author:
    type: absorbing
  a3_budget_exceeded:
    type: absorbing

transitions:
  - { from: s0_deterministic_verify, to: a1_ready_for_human_review, probability: 0.82 }
  - { from: s0_deterministic_verify, to: s1_failure_triage, probability: 0.18 }
  - { from: s1_failure_triage, to: s2_agent_reasoning, probability: 0.75 }
  - { from: s1_failure_triage, to: a2_escalate_to_author, probability: 0.25 }
  - { from: s2_agent_reasoning, to: s3_sandbox_validation, prior_driven: true, per_attempt: true }
  - { from: s3_sandbox_validation, to: s4_regression_check, probability: 0.65 }
  - { from: s3_sandbox_validation, to: s2_agent_reasoning, probability: 0.25, per_attempt: true }
  - { from: s3_sandbox_validation, to: a2_escalate_to_author, probability: 0.10 }
  - { from: s4_regression_check, to: a1_ready_for_human_review, probability: 0.90 }
  - { from: s4_regression_check, to: a2_escalate_to_author, probability: 0.10 }

policy:
  min_confidence: 0.40
  max_attempts: 3
  max_tokens: 200000
  wall_clock_seconds: 900

priors:
  default:
    default:
      success: [0.95, 0.95, 0.95]
      cost_weight: 1.0
      source: prior
    # most lint failures resolve on the first attempt (spec 0001 §4)
    lint_error:
      success: [0.92, 0.65, 0.20]
      cost_weight: 1.0
      source: prior
    type_mismatch:
      success: [0.85, 0.55, 0.25]
      cost_weight: 1.5
      source: prior
    unit_assertion:
      success: [0.74, 0.45, 0.15]
      cost_weight: 2.5
      source: prior
    infra_timeout:
      success: [0.05, 0.01, 0.00]
      cost_weight: 5.0
      source: prior

agent:
  adapter: simulated
  allow_write:
    - "src/**"
    - "tests/**"

telemetry:
  sink: file
  path: examples/02-unit-assertion-decay/.markov-ci/events.jsonl
