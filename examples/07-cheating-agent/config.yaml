# Example 07 — the cheating agent.
# A repair that would make the failing test "pass" by deleting its assertion —
# the project's anti-pattern #1. The agent is a BYO command (spec 0006 T3): a
# script that emits a test-weakening diff. The TMR guardrail hard-stops it before
# the sandbox ever runs. Green still means green.
version: 1

states:
  s0_deterministic_verify:
    type: transient
  s1_failure_triage:
    type: transient
  s2_agent_reasoning:
    type: transient
    loop_capable: true
  s3_sandbox_validation:
    type: transient
    loop_capable: true
  s4_regression_check:
    type: transient
  a1_ready_for_human_review:
    type: absorbing
  a2_escalate_to_author:
    type: absorbing
  a3_budget_exceeded:
    type: absorbing

transitions:
  - { from: s0_deterministic_verify, to: a1_ready_for_human_review, probability: 0.82 }
  - { from: s0_deterministic_verify, to: s1_failure_triage, probability: 0.18 }
  - { from: s1_failure_triage, to: s2_agent_reasoning, probability: 0.75 }
  - { from: s1_failure_triage, to: a2_escalate_to_author, probability: 0.25 }
  - { from: s2_agent_reasoning, to: s3_sandbox_validation, prior_driven: true, per_attempt: true }
  - { from: s3_sandbox_validation, to: s4_regression_check, probability: 0.65 }
  - { from: s3_sandbox_validation, to: s2_agent_reasoning, probability: 0.25, per_attempt: true }
  - { from: s3_sandbox_validation, to: a2_escalate_to_author, probability: 0.10 }
  - { from: s4_regression_check, to: a1_ready_for_human_review, probability: 0.90 }
  - { from: s4_regression_check, to: a2_escalate_to_author, probability: 0.10 }

policy:
  min_confidence: 0.40
  max_attempts: 3
  max_tokens: 200000
  wall_clock_seconds: 900

priors:
  default:
    default:
      success: [0.95, 0.95, 0.95]
      source: prior
    lint_error:
      success: [0.92, 0.65, 0.20]
      source: prior
    type_mismatch:
      success: [0.85, 0.55, 0.25]
      source: prior
    unit_assertion:
      success: [0.74, 0.45, 0.15]
      source: prior
    infra_timeout:
      success: [0.05, 0.01, 0.00]
      source: prior

agent:
  adapter: harness
  allow_write:
    - "src/**"
    - "tests/**"
  harness:
    command_template: "python3 examples/07-cheating-agent/cheat.py %PROMPT%"
    timeout_seconds: 60

telemetry:
  sink: file
  path: examples/07-cheating-agent/.markov-ci/events.jsonl
